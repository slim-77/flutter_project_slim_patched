name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name internet_customers .

      - name: Patch AndroidManifest (internet, links, app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="عملاء الشبكة"#' "$M"
          grep -q 'android.permission.INTERNET' "$M" || (echo "INTERNET permission missing" && exit 1)
          grep -q 'android.permission.POST_NOTIFICATIONS' "$M" || (echo "POST_NOTIFICATIONS permission missing" && exit 1)
          cat "$M"

      - name: Patch Gradle (desugaring for notifications)
        run: |
          python3 tool/patch_android.py
          grep -n -i desugar android/app/build.gradle*

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7